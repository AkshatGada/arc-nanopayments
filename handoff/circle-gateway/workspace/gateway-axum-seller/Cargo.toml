[package]
name = "gateway-axum-seller"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false
default-run = "gateway-axum-seller"

[dependencies]
# Pin the exact upstream source inspected for this example. No upstream patches.
x402-axum = { git = "https://github.com/x402-rs/x402-rs", rev = "e75adda8a0e3cf23db446883ba91b88bbab2fe28" }
x402-types = { git = "https://github.com/x402-rs/x402-rs", rev = "e75adda8a0e3cf23db446883ba91b88bbab2fe28" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
serde_json = "1"
thiserror = "2"
url = "2.5"
uuid = "1"
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }

[workspace]
